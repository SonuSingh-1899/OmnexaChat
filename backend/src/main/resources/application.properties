# Common application config
spring.application.name=chat
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}
server.address=0.0.0.0
spring.main.banner-mode=off

# Redis Configuration - Upstash
spring.data.redis.url=rediss://default:gQAAAAAAAWryAAIgcDIxNzc4NDFmZjUxNDI0NTVlOGVjOTVjZWFmY2EwZWFlOQ@patient-horse-92914.upstash.io:6379
spring.data.redis.timeout=10000ms
spring.data.redis.connect-timeout=10000ms
spring.data.redis.ssl.enabled=true

# Mail Configuration
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

profile.avatar.max-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Chat Configuration
chat.message.retention-days=3
chat.cleanup.cron=0 0 2 * * ?

# WebSocket
spring.websocket.support=true
