# Production config
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS:https://omnexa-flame.vercel.app}

# JWT
jwt.secret=${JWT_SECRET}

# Brevo Email
brevo.api.key=${BREVO_API_KEY}

# PostgreSQL - YEH LINES ADD KARO
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate - DIALECT ADD KARO
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Redis
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=10000ms
spring.data.redis.connect-timeout=10000ms
spring.data.redis.ssl.enabled=true